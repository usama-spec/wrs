<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A premium speech-to-text converter using the Web Speech API.">
    <title>NestifyTech - Audio to Text</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Audio to Text</h1>
            <p>Speak clearly, we'll do the rest</p>
        </header>
        <main>
            <div class="transcription-card">
                <div class="visualizer" id="visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <div class="text-container">
                    <p id="interim-text" class="interim"></p>
                    <p id="final-text" class="final">Tap the microphone to start transcribing...</p>
                </div>
                <div class="status-indicator" id="status">Ready</div>
            </div>
            <div class="controls">
                <button id="start-btn" class="btn-primary" aria-label="Start Recording">
                    <svg class="mic-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                        <path
                            d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                    </svg>
                </button>
                <button id="copy-btn" class="btn-secondary" title="Copy to Clipboard">
                    <svg class="copy-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                    </svg>
                </button>
                <button id="clear-btn" class="btn-secondary" title="Clear Text">
                    <svg class="clear-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                    </svg>
                </button>
            </div>
        </main>
        <footer>
            <p>&copy; 2026 NestifyTech & DevSparks AI. Powered by Web Speech API.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
