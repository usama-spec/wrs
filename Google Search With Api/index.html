<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Search Interface</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="search-wrapper">
        <div class="search-container">
            <h1 class="logo">Search<span>Everything</span></h1>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="Search anything on Google..." autocomplete="off">
                <button id="search-btn"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div id="suggestions-list" class="suggestions-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
