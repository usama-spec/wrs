<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antilog Calculator | Premium Tools</title>
    <meta name="description"
        content="Calculate antilogarithms with ease using our animated, stylish glassmorphism calculator.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <main class="container">
        <h1>Antilog Calculator</h1>
        <div class="input-group">
            <label for="number">Logarithmic Value (x)</label>
            <input type="number" id="number" placeholder="Enter number..." step="any">
        </div>
        <div class="input-group">
            <label>Select Base (b)</label>
            <div class="options-group">
                <button class="base-btn active" data-base="10">Base 10</button>
                <button class="base-btn" data-base="e">Base e</button>
                <button class="base-btn" data-base="custom">Custom</button>
            </div>
            <input type="number" id="custom-base" placeholder="Enter custom base..."
                style="display: none; margin-top: 10px;">
        </div>
        <button class="calculate-btn" id="calculate">Calculate Antilog</button>
        <div class="result-container" id="result-container">
            <span class="result-label">The Antilog is</span>
            <div class="result-value" id="result-value">0</div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
