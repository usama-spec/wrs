<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Product Cards - Dark Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex bg-slate-900 flex-col items-center text-white">
    <div class="flex justify-center items-center min-h-screen">
        <div class="tilt group relative m-10 flex w-full max-w-xs flex-col overflow-hidden rounded-xl border border-gray-200 bg-white shadow-lg hover:shadow-2xl">
            <a class="relative mx-3 mt-3 flex h-60 overflow-hidden rounded-xl">
                <img class="object-cover transition-transform duration-700 group-hover:scale-110"
                    src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=500&q=60" />
                <span class="badge-glow absolute top-0 left-0 m-2 rounded-full bg-black px-3 py-1 text-xs font-semibold text-yellow-400">
                    39% OFF
                </span>
            </a>
            <div class="mt-4 px-5 pb-5">
                <h5 class="text-xl font-semibold text-slate-900 group-hover:tracking-wide transition">
                    Nike Air MX Super 2500 – Red
                </h5>
                <div class="mt-3 mb-5 flex items-center justify-between">
                    <p class="group-hover:scale-105 transition">
                        <span class="text-3xl font-bold text-slate-900">$449</span>
                        <span class="text-sm line-through text-gray-500">$699</span>
                    </p>
                    <div class="flex items-center text-yellow-400 drop-shadow-sm">
                        ⭐⭐⭐⭐⭐
                        <span class="ml-2 rounded bg-yellow-200 px-2 text-xs font-semibold text-black">5.0</span>
                    </div>
                </div>
                <a class="relative overflow-hidden flex items-center justify-center rounded-md bg-black px-5 py-2.5 text-sm font-medium text-white transition-all duration-500 hover:scale-105 hover:bg-gray-900">
                    <span class="absolute inset-0 bg-white opacity-0 group-hover:opacity-10 transition"></span>
                    🛒 Add to cart
                </a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
